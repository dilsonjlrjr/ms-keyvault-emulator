name: kvemu

services:
  kvemu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: "${VERSION:-dev}"
    image: "ghcr.io/dilsonrabelo/kvemu:${VERSION:-dev}"
    container_name: kvemu
    restart: unless-stopped
    ports:
      - "${KV_PORT:-13000}:13000"
    environment:
      KV_ADDR:         "0.0.0.0:13000"
      KV_VAULT_HOST:   "${KV_VAULT_HOST:-localhost:13000}"
      KV_TENANT_ID:    "${KV_TENANT_ID:-a0c2a3f5-e1b3-4d6a-9c41-2cdd1f2c7e0f}"
      KV_TLS_AUTO:     "true"
      KV_AUTH_STRICT:  "${KV_AUTH_STRICT:-false}"
      KV_MASTER_KEY:   "${KV_MASTER_KEY:-}"
      KV_DATA:         "/data/kv.db"
      KV_CERT_DIR:     "/certs"
      KV_CA_OUT:       "/certs/ca.pem"
    volumes:
      - kvemu-data:/data
      - kvemu-certs:/certs
    healthcheck:
      test: ["CMD", "/kvemu", "healthcheck", "--addr", "https://localhost:13000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  kvemu-data:
  kvemu-certs:
